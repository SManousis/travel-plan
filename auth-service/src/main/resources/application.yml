spring:
  application:
    name: auth-service
security:
  token-secret: ${AUTH_TOKEN_SECRET:replace-with-at-least-32-random-characters}
  access-token-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:900}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:change-me-admin}
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
management:
  server:
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_PORT:9081}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
